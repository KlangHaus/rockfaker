# osv-scanner-accepter for rockfaker.
#
# 🔴 HVER accept har en UDLOEBSDATO. En accept uden udloeb er permanent,
# og 'midlertidigt' bliver varigt uden at nogen beslutter det. Naar datoen
# passeres, fejler `scripts/check-osv-ignore-expiry.py` og tvinger
# beslutningen frem igen.
#
# Alle nedenstaaende er TRANSITIVE via devDependencyen @mockoon/cli.
# rockfaker har `dependencies: {}` og udgives ikke — eksponeringen er et
# dev-vaerktoej, ikke en runtime-flade. Det goer dem ikke harmloese, men
# det er grunden til at de accepteres kortvarigt frem for at blokere.


